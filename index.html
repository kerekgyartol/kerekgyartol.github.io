  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #24114a 0%, transparent 35%),
        radial-gradient(circle at top right, #0b4050 0%, transparent 30%),
        #090b12;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: min(1400px, 94%);
      margin: 0 auto;
      padding: 40px 0 60px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 5vw, 58px);
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ff2bd6, #8b5cf6, #20d9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      margin: 0;
      color: #aeb5c7;
      font-size: 16px;
    }

    .search-wrapper {
      max-width: 650px;
      margin: 0 auto 35px;
    }

    #search {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 16px;
      backdrop-filter: blur(10px);
    }

    #search::placeholder {
      color: #858da0;
    }

    #search:focus {
      border-color: #9b5cff;
      box-shadow: 0 0 25px rgba(155,92,255,.18);
    }

    .playlist-count {
      text-align: center;
      color: #858da0;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .playlists {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .playlist {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 120px;
      padding: 22px;
      border-radius: 18px;
      text-decoration: none;
      color: white;
      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.095),
          rgba(255,255,255,.035)
        );

      border: 1px solid rgba(255,255,255,.09);

      box-shadow:
        0 10px 35px rgba(0,0,0,.25);

      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .playlist::before {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      right: -35px;
      top: -35px;
      background: #a855f7;
      filter: blur(45px);
      opacity: .18;
      pointer-events: none;
    }

    .playlist:hover {
      transform: translateY(-5px);
      border-color: rgba(168,85,247,.55);

      background:
        linear-gradient(
          145deg,
          rgba(168,85,247,.14),
          rgba(32,217,255,.06)
        );

      box-shadow:
        0 15px 45px rgba(0,0,0,.4),
        0 0 30px rgba(168,85,247,.12);
    }

    .number {
      flex: 0 0 45px;
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-right: 16px;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #a855f7,
        #ec4899
      );

      font-size: 14px;
      font-weight: bold;

      box-shadow:
        0 5px 20px rgba(168,85,247,.25);
    }

    .content {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .open {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: #9da7bc;
    }

    .playlist:hover .open {
      color: #d6b5ff;
    }

    .no-results {
      display: none;
      text-align: center;
      padding: 50px 20px;
      color: #858da0;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 25px;
      }

      .playlists {
        grid-template-columns: 1fr;
      }

      .playlist {
        min-height: 100px;
      }
    }
  </style>
</head>

    /*
     * ============================================================
     * MEGJELENÍTÉS
     * ============================================================
     */

    const playlistsContainer =
      document.getElementById("playlists");

    const searchInput =
      document.getElementById("search");

    const playlistCount =
      document.getElementById("playlistCount");

    const noResults =
      document.getElementById("noResults");


    function renderPlaylists(list) {

      playlistsContainer.innerHTML = "";

      playlistCount.textContent =
        `${list.length} playlist`;

      noResults.style.display =
        list.length === 0 ? "block" : "none";


      list.forEach((playlist, index) => {

        const card = document.createElement("a");

        card.className = "playlist";

        card.href = playlist.url;

        card.target = "_blank";

        card.rel = "noopener noreferrer";


        card.innerHTML = `
          <div class="number">
            ${playlists.indexOf(playlist) + 1}
          </div>

          <div class="content">
            <div class="title">
              ${escapeHtml(playlist.title)}
            </div>

            <div class="open">
              ▶ Playlist megnyitása
            </div>
          </div>
        `;


        playlistsContainer.appendChild(card);

      });

    }


    /*
     * Biztonságos HTML-kiírás
     */

    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    /*
     * KERESÉS
     */

    searchInput.addEventListener("input", function() {

      const query =
        this.value
          .toLowerCase()
          .trim();


      if (!query) {

        renderPlaylists(playlists);

        return;

      }


      const filtered =
        playlists.filter(playlist =>
          playlist.title
            .toLowerCase()
            .includes(query)
        );


      renderPlaylists(filtered);

    });


    /*
     * INDÍTÁS
     */

    renderPlaylists(playlists);
