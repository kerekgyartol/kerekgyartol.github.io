<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LKSF — LK Sound Factory</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #020205;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND
        ========================== */

        body::before {
            content: "";
            position: fixed;
            inset: -30%;

            background:
                radial-gradient(
                    circle at 25% 15%,
                    rgba(0, 70, 255, .20),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 80% 65%,
                    rgba(145, 0, 255, .20),
                    transparent 28%
                );

            animation: backgroundMove 12s ease-in-out infinite alternate;

            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(255,255,255,.015) 1px,
                    transparent 1px
                );

            background-size: 100% 4px;
            opacity: .10;

            pointer-events: none;
            z-index: -1;
        }

        @keyframes backgroundMove {
            0% {
                transform: translate(-2%, -2%) scale(1);
            }

            100% {
                transform: translate(2%, 2%) scale(1.08);
            }
        }

        /* =========================
           MAIN
        ========================== */

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 55px 20px 40px;
            text-align: center;
        }

        /* =========================
           LOGO
        ========================== */

        .logo {
            width: min(100%, 450px);
            height: auto;
            display: block;
            margin: 0 auto 15px;

            filter:
                drop-shadow(0 0 12px rgba(0, 70, 255, .55))
                drop-shadow(0 0 30px rgba(150, 0, 255, .35));

            animation: logoGlow 4s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 10px rgba(0, 70, 255, .50))
                    drop-shadow(0 0 22px rgba(150, 0, 255, .30));
            }

            50% {
                filter:
                    drop-shadow(0 0 20px rgba(0, 100, 255, .80))
                    drop-shadow(0 0 38px rgba(180, 0, 255, .55));
            }
        }

        .subtitle {
            color: #999;
            font-size: 12px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 38px;
        }

        /* =========================
           MAIN BUTTONS
        ========================== */

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .button {
            display: block;
            width: 100%;

            padding: 18px 24px;

            border: 1px solid rgba(255,255,255,.15);
            border-radius: 14px;

            background: rgba(255,255,255,.045);

            color: white;
            text-decoration: none;

            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;

            transition:
                transform .25s ease,
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease;
        }

        .button:hover {
            transform: translateY(-3px);

            border-color: #865cff;

            background: rgba(100,40,255,.15);

            box-shadow:
                0 0 25px rgba(80,50,255,.25);
        }

        .button.primary {
            padding: 21px 24px;

            font-size: 16px;

            background:
                linear-gradient(
                    90deg,
                    #063bff,
                    #7900ff
                );

            border-color: #705cff;

            box-shadow:
                0 0 25px rgba(40,70,255,.40),
                0 0 45px rgba(150,0,255,.18);
        }

        .button.primary:hover {
            background:
                linear-gradient(
                    90deg,
                    #1450ff,
                    #941aff
                );

            box-shadow:
                0 0 35px rgba(50,80,255,.60),
                0 0 60px rgba(170,0,255,.35);
        }

        /* =========================
           MUSIC ARCHIVE
        ========================== */

        .archive {
            margin-top: 65px;
        }

        .section-label {
            color: #777;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .archive-card {
            position: relative;

            padding: 30px 22px;

            border: 1px solid rgba(120,80,255,.22);
            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(50,30,100,.22),
                    rgba(255,255,255,.025)
                );

            box-shadow:
                inset 0 0 35px rgba(100,0,255,.05),
                0 10px 40px rgba(0,0,0,.30);

            overflow: hidden;
        }

        .archive-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -100px;
            right: -70px;

            background: #5b00ff;

            filter: blur(80px);

            opacity: .18;
        }

        .archive-title {
            position: relative;

            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;

            margin-bottom: 10px;
        }

        .archive-count {
            position: relative;

            color: #8c6cff;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 3px;

            margin-bottom: 16px;
        }

        .archive-text {
            position: relative;

            color: #777;

            font-size: 13px;
            line-height: 1.6;

            margin-bottom: 24px;
        }

        .archive-button {
            position: relative;

            display: block;

            padding: 17px 20px;

            border-radius: 12px;

            background: rgba(255,255,255,.07);

            border: 1px solid rgba(255,255,255,.14);

            color: white;

            text-decoration: none;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 2px;

            transition: .25s ease;
        }

        .archive-button:hover {
            transform: translateY(-2px);

            background: linear-gradient(
                90deg,
                #073cff,
                #7900ff
            );

            border-color: #705cff;

            box-shadow:
                0 0 25px rgba(80,50,255,.35);
        }

        /* =========================
           FUTURE PLATFORMS
        ========================== */

        .future {
            margin-top: 18px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .future-item {
            padding: 16px 10px;

            border: 1px solid rgba(255,255,255,.06);
            border-radius: 12px;

            background: rgba(255,255,255,.02);

            color: #555;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        .future-item span {
            display: block;

            margin-top: 7px;

            color: #333;

            font-size: 8px;

            letter-spacing: 1px;
        }

        /* =========================
           FOOTER
        ========================== */

        .footer {
            margin-top: 60px;

            color: #3e3e3e;

            font-size: 9px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            .container {
                padding: 35px 18px 30px;
            }

            .logo {
                width: 100%;
            }

            .subtitle {
                font-size: 9px;
                letter-spacing: 4px;
                margin-bottom: 30px;
            }

            .archive {
                margin-top: 50px;
            }

            .archive-title {
                font-size: 20px;
            }
        }
    </style>
</head>


<body>

    <main class="container">


        <!-- =========================
             LKSF LOGO
        ========================== -->

        <img
            src="logo.png"
            alt="LKSF — LK Sound Factory"
            class="logo"
        >


        <div class="subtitle">
            LK Sound Factory
        </div>


        <!-- =========================
             MAIN LINKS
        ========================== -->

        <div class="buttons">

            <a
                class="button primary"
                href="https://www.youtube.com/@LKSF-w7j/podcasts"
                target="_blank"
                rel="noopener noreferrer">

                LISTEN TO MY MUSIC

            </a>


            <a
                class="button"
                href="https://www.youtube.com/@LKSF-w7j/podcasts"
                target="_blank"
                rel="noopener noreferrer">

                YOUTUBE

            </a>


            <a
                class="button"
                href="https://www.tiktok.com/@lksoundfactory00?is_from_webapp=1&sender_device=pc"
                target="_blank"
                rel="noopener noreferrer">

                TIKTOK

            </a>

        </div>


        <!-- =========================
             MUSIC ARCHIVE
        ========================== -->

        <section class="archive">

            <div class="section-label">
                Music Archive
            </div>


            <div class="archive-card">

                <div class="archive-title">
                    LKSF MUSIC
                </div>


                <div class="archive-count">
                    3000+ TRACKS
                </div>


                <div class="archive-text">
                    A growing collection of music,
                    sounds and productions from
                    LK Sound Factory.
                </div>


                <a
                    class="archive-button"
                    href="https://www.youtube.com/@LKSF-w7j/podcasts"
                    target="_blank"
                    rel="noopener noreferrer">

                    OPEN MUSIC ARCHIVE

                </a>

            </div>


            <!-- FUTURE PLATFORMS -->

            <div class="future">

                <div class="future-item">
                    INSTAGRAM
                    <span>COMING SOON</span>
                </div>

                <div class="future-item">
                    SOUNDCLOUD
                    <span>COMING SOON</span>
                </div>

            </div>

        </section>


        <!-- =========================
             FOOTER
        ========================== -->

        <div class="footer">
            © 2026 LKSF — LK SOUND FACTORY
        </div>


    </main>

</body>
</html>
