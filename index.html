<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LKSF — LK Sound Factory</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #020205;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* BACKGROUND */

        body::before {
            content: "";
            position: fixed;
            inset: -30%;
            background:
                radial-gradient(
                    circle at 30% 20%,
                    rgba(0, 70, 255, .18),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 75% 65%,
                    rgba(140, 0, 255, .18),
                    transparent 28%
                );

            animation: backgroundMove 12s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(255,255,255,.015) 1px,
                    transparent 1px
                );

            background-size: 100% 4px;
            opacity: .12;

            pointer-events: none;
            z-index: -1;
        }

        @keyframes backgroundMove {
            0% {
                transform: translate(-2%, -2%) scale(1);
            }

            100% {
                transform: translate(2%, 2%) scale(1.08);
            }
        }

        /* MAIN */

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 55px 20px 35px;
            text-align: center;
        }

        /* LOGO */

        .logo {
            width: min(100%, 450px);
            height: auto;
            display: block;
            margin: 0 auto 15px;

            filter:
                drop-shadow(0 0 12px rgba(0, 70, 255, .55))
                drop-shadow(0 0 30px rgba(150, 0, 255, .35));

            animation: logoGlow 4s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 10px rgba(0, 70, 255, .50))
                    drop-shadow(0 0 22px rgba(150, 0, 255, .30));
            }

            50% {
                filter:
                    drop-shadow(0 0 20px rgba(0, 100, 255, .80))
                    drop-shadow(0 0 38px rgba(180, 0, 255, .55));
            }
        }

        .subtitle {
            color: #999;
            font-size: 12px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .button {
            position: relative;
            display: block;
            width: 100%;

            padding: 18px 24px;

            border: 1px solid rgba(255,255,255,.15);
            border-radius: 14px;

            background: rgba(255,255,255,.045);

            color: white;
            text-decoration: none;

            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;

            transition:
                transform .25s ease,
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease;
        }

        .button:hover {
            transform: translateY(-3px);

            border-color: #865cff;

            background: rgba(100,40,255,.15);

            box-shadow:
                0 0 25px rgba(80,50,255,.25);
        }

        /* MAIN BUTTON */

        .button.primary {
            padding: 21px 24px;

            font-size: 16px;

            background:
                linear-gradient(
                    90deg,
                    #063bff,
                    #7900ff
                );

            border-color: #705cff;

            box-shadow:
                0 0 25px rgba(40,70,255,.40),
                0 0 45px rgba(150,0,255,.18);
        }

        .button.primary:hover {
            background:
                linear-gradient(
                    90deg,
                    #1450ff,
                    #941aff
                );

            box-shadow:
                0 0 35px rgba(50,80,255,.60),
                0 0 60px rgba(170,0,255,.35);
        }

        /* MUSIC SECTION */

        .section {
            margin-top: 65px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #777;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .music-card {
            padding: 25px 20px;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.015)
                );

            box-shadow:
                inset 0 0 30px rgba(100,0,255,.035);
        }

        .music-title {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .music-text {
            color: #777;
            font-size: 13px;
            line-height: 1.6;
        }

        /* COMING SOON */

        .coming {
            margin-top: 16px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .coming-item {
            padding: 16px 10px;

            border: 1px solid rgba(255,255,255,.07);
            border-radius: 12px;

            color: #555;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;

            background: rgba(255,255,255,.02);
        }

        .coming-item span {
            display: block;
            color: #333;
            margin-top: 6px;
            font-size: 8px;
        }

        /* FOOTER */

        .footer {
            margin-top: 65px;

            color: #3e3e3e;

            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* MOBILE */

        @media (max-width: 480px) {

            .container {
                padding-top: 35px;
            }

            .logo {
                width: 100%;
            }

            .subtitle {
                font-size: 9px;
                letter-spacing: 4px;
                margin-bottom: 30px;
            }

            .section {
                margin-top: 50px;
            }

            .music-title {
                font-size: 18px;
            }
        }
    </style>
</head>


<body>

    <main class="container">

        <!-- LKSF LOGO -->

        <img
            src="logo.png"
            alt="LKSF — LK Sound Factory"
            class="logo"
        >


        <div class="subtitle">
            LK Sound Factory
        </div>


        <!-- MAIN LINKS -->

        <div class="buttons">

            <a
                class="button primary"
                href="https://www.youtube.com/@LKSF-w7j/podcasts"
                target="_blank"
                rel="noopener noreferrer">

                LISTEN TO MY MUSIC

            </a>


            <a
                class="button"
                href="https://www.youtube.com/@LKSF-w7j/podcasts"
                target="_blank"
                rel="noopener noreferrer">

                YOUTUBE

            </a>


            <a
                class="button"
                href="https://www.tiktok.com/@lksoundfactory00?is_from_webapp=1&sender_device=pc"
                target="_blank"
                rel="noopener noreferrer">

                TIKTOK

            </a>

        </div>


        <!-- MUSIC -->

        <section class="section">

            <div class="section-title">
                Music
            </div>

            <div class="music-card">

                <div class="music-title">
                    LKSF SOUND FACTORY
                </div>

                <div class="music-text">
                    Music, sound and future releases.
                    More platforms coming soon.
                </div>

            </div>


            <div class="coming">

                <div class="coming-item">
                    INSTAGRAM
                    <span>COMING SOON</span>
                </div>

                <div class="coming-item">
                    SOUNDCLOUD
                    <span>COMING SOON</span>
                </div>

            </div>

        </section>


        <!-- FOOTER -->

        <div class="footer">
            © 2026 LKSF — LK SOUND FACTORY
        </div>

    </main>

</body>
</html>


    </main>

</body>
