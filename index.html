<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LKSF Music Archive</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #020205;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            padding: 35px 18px 50px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -30%;

            background:
                radial-gradient(
                    circle at 25% 10%,
                    rgba(0,70,255,.20),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(145,0,255,.20),
                    transparent 28%
                );

            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: auto;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: min(100%, 330px);
            display: block;
            margin: 0 auto 15px;

            filter:
                drop-shadow(0 0 12px rgba(0,70,255,.55))
                drop-shadow(0 0 28px rgba(150,0,255,.35));
        }

        .title {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .subtitle {
            margin-top: 10px;

            color: #777;

            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* SEARCH */

        .search {
            width: 100%;

            padding: 18px 20px;

            margin-bottom: 30px;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,.13);

            background: rgba(255,255,255,.045);

            color: white;

            font-size: 14px;

            outline: none;

            transition: .25s ease;
        }

        .search:focus {
            border-color: #725cff;

            box-shadow:
                0 0 25px rgba(90,60,255,.18);
        }

        .search::placeholder {
            color: #555;
        }

        /* SECTION */

        .section-title {
            color: #666;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 5px;

            margin-bottom: 15px;

            text-transform: uppercase;
        }

        /* CATEGORIES */

        .categories {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;
        }

        .category {
            position: relative;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            min-height: 145px;

            padding: 22px 18px;

            border-radius: 17px;

            border: 1px solid rgba(255,255,255,.09);

            background:
                linear-gradient(
                    145deg,
                    rgba(55,30,110,.20),
                    rgba(255,255,255,.025)
                );

            text-decoration: none;

            color: white;

            overflow: hidden;

            transition:
                transform .25s ease,
                border-color .25s ease,
                box-shadow .25s ease;
        }

        .category::after {
            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            right: -50px;
            top: -50px;

            background: #5c00ff;

            filter: blur(55px);

            opacity: .12;
        }

        .category:hover {
            transform: translateY(-4px);

            border-color: #755cff;

            box-shadow:
                0 0 28px rgba(80,50,255,.20);
        }

        .category-name {
            position: relative;
            z-index: 1;

            font-size: 17px;
            font-weight: 900;

            letter-spacing: 1px;
        }

        .category-count {
            position: relative;
            z-index: 1;

            margin-top: 8px;

            color: #806cff;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        .open {
            position: relative;
            z-index: 1;

            margin-top: 20px;

            color: #777;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        /* NO RESULTS */

        .no-results {
            display: none;

            text-align: center;

            padding: 35px;

            color: #555;

            border: 1px solid rgba(255,255,255,.06);

            border-radius: 15px;

            margin-top: 15px;
        }

        /* BACK */

        .back {
            display: block;

            margin: 40px auto 0;

            width: fit-content;

            color: #666;

            text-decoration: none;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 3px;

            transition: .2s ease;
        }

        .back:hover {
            color: white;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 45px;

            color: #333;

            font-size: 9px;

            letter-spacing: 3px;
        }

        /* MOBILE */

        @media (max-width: 520px) {

            .categories {
                grid-template-columns: 1fr;
            }

            .category {
                min-height: 125px;
            }

            .title {
                font-size: 21px;
            }
        }
    </style>
</head>


<body>

    <main class="container">


        <!-- HEADER -->

        <header class="header">

            <img
                src="logo.png"
                alt="LKSF — LK Sound Factory"
                class="logo"
            >

            <h1 class="title">
                MUSIC ARCHIVE
            </h1>

            <div class="subtitle">
                LK Sound Factory · 3000+ Tracks
            </div>

        </header>


        <!-- SEARCH -->

        <input
            type="search"
            id="search"
            class="search"
            placeholder="Search collections..."
            autocomplete="off"
        >


        <!-- CATEGORIES -->

        <div class="section-title">
            Collections
        </div>


        <div class="categories" id="categories">


            <!-- TECHNO -->

            <a
                class="category"
                data-name="techno"
                href="https://www.youtube.com/playlist?list=PLPGx1rxcqhDI"
                target="_blank"
                rel="noopener noreferrer">

                <div>
                    <div class="category-name">
                        TECHNO
                    </div>

                    <div class="category-count">
                        127+ EPISODES
                    </div>
                </div>

                <div class="open">
                    OPEN COLLECTION →
                </div>

            </a>


            <!-- HOUSE -->

            <a
                class="category"
                data-name="house"
                href="https://www.youtube.com/playlist?list=PLMynOQow254EQJKwQCpS6vO2rmHGpN8pT"
                target="_blank"
                rel="noopener noreferrer">

                <div>
                    <div class="category-name">
                        HOUSE
                    </div>

                    <div class="category-count">
                        104+ EPISODES
                    </div>
                </div>

                <div class="open">
                    OPEN COLLECTION →
                </div>

            </a>


            <!-- LKSF REMIX -->

            <a
                class="category"
                data-name="lksf remix remix"
                href="https://www.youtube.com/playlist?list=PLBE7fKGViA3s"
                target="_blank"
                rel="noopener noreferrer">

                <div>
                    <div class="category-name">
                        LKSF REMIX
                    </div>

                    <div class="category-count">
                        895+ EPISODES
                    </div>
                </div>

                <div class="open">
                    OPEN COLLECTION →
                </div>

            </a>


            <!-- MASHUP -->

            <a
                class="category"
                data-name="lksf mashup mashup"
                href="https://www.youtube.com/playlist?list=PLMynOQow254EPSsbTahNnHSQspC6yE8MM"
                target="_blank"
                rel="noopener noreferrer">

                <div>
                    <div class="category-name">
                        LKSF MASHUP
                    </div>

                    <div class="category-count">
                        149+ EPISODES
                    </div>
                </div>

                <div class="open">
                    OPEN COLLECTION →
                </div>

            </a>


        </div>


        <div
            id="noResults"
            class="no-results">

            No collection found.

        </div>


        <!-- BACK -->

        <a
            href="index.html"
            class="back">

            ← BACK TO LKSF

        </a>


        <div class="footer">
            © 2026 LKSF — LK SOUND FACTORY
        </div>


    </main>


    <!-- SEARCH SCRIPT -->

    <script>

        const search =
            document.getElementById("search");

        const categories =
            document.querySelectorAll(".category");

        const noResults =
            document.getElementById("noResults");


        search.addEventListener("input", function () {

            const query =
                this.value
                    .toLowerCase()
                    .trim();

            let visible = 0;


            categories.forEach(function (category) {

                const name =
                    category
                        .dataset
                        .name
                        .toLowerCase();


                if (name.includes(query)) {

                    category.style.display =
                        "flex";

                    visible++;

                } else {

                    category.style.display =
                        "none";

                }

            });


            if (visible === 0) {

                noResults.style.display =
                    "block";

            } else {

                noResults.style.display =
                    "none";

            }

        });

    </script>

</body>
</html>
