    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 10% 0%, #29114d 0%, transparent 32%),
        radial-gradient(circle at 90% 0%, #073e4c 0%, transparent 30%),
        #090b12;
    }

    .container {
      width: min(1400px, 94%);
      margin: auto;
      padding: 40px 0 60px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 58px);
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ff2bd6, #8b5cf6, #20d9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      margin: 0;
      color: #aeb5c7;
    }

    .search-box {
      max-width: 650px;
      margin: 0 auto 25px;
    }

    #search {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      outline: none;
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 16px;
      backdrop-filter: blur(10px);
    }

    #search::placeholder {
      color: #858da0;
    }

    #search:focus {
      border-color: #a855f7;
      box-shadow: 0 0 25px rgba(168,85,247,.2);
    }

    .count {
      text-align: center;
      color: #858da0;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .playlists {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }

    .playlist {
      position: relative;
      min-height: 120px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;

      color: white;
      text-decoration: none;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.095),
          rgba(255,255,255,.035)
        );

      border: 1px solid rgba(255,255,255,.09);
      border-radius: 18px;

      box-shadow: 0 10px 35px rgba(0,0,0,.25);

      overflow: hidden;

      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .playlist::before {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      right: -40px;
      top: -40px;
      background: #a855f7;
      filter: blur(45px);
      opacity: .18;
    }

    .playlist:hover {
      transform: translateY(-5px);
      border-color: rgba(168,85,247,.55);
      box-shadow:
        0 15px 45px rgba(0,0,0,.4),
        0 0 30px rgba(168,85,247,.12);
    }

    .number {
      position: relative;
      z-index: 1;

      flex: 0 0 45px;
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #a855f7,
        #ec4899
      );

      font-size: 14px;
      font-weight: bold;
    }

    .content {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .open {
      margin-top: 8px;
      font-size: 12px;
      color: #9da7bc;
    }

    .playlist:hover .open {
      color: #d6b5ff;
    }

    .no-results {
      display: none;
      text-align: center;
      padding: 50px 20px;
      color: #858da0;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 25px;
      }

      .playlists {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

/* =========================================================
   MEGJELENÍTÉS
   ========================================================= */

const container = document.getElementById("playlists");
const search = document.getElementById("search");
const count = document.getElementById("count");
const noResults = document.getElementById("noResults");


function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}


function render(list) {

  container.innerHTML = "";

  count.textContent =
    `${list.length} playlist`;

  noResults.style.display =
    list.length === 0 ? "block" : "none";


  list.forEach((playlist) => {

    const originalIndex =
      playlists.indexOf(playlist) + 1;

    const card =
      document.createElement("a");

    card.className = "playlist";

    card.href = playlist.url;

    card.target = "_blank";

    card.rel = "noopener noreferrer";


    card.innerHTML = `

      <div class="number">
        ${originalIndex}
      </div>

      <div class="content">

        <div class="title">
          ${escapeHtml(playlist.title)}
        </div>

        <div class="open">
          ▶ Playlist megnyitása
        </div>

      </div>

    `;

    container.appendChild(card);

  });
}


/* =========================================================
   KERESÉS
   ========================================================= */

search.addEventListener("input", function () {

  const query =
    this.value
      .toLowerCase()
      .trim();


  if (!query) {

    render(playlists);

    return;
  }


  const filtered =
    playlists.filter(playlist =>
      playlist.title
        .toLowerCase()
        .includes(query)
    );


  render(filtered);

});


/* =========================================================
   INDÍTÁS
   ========================================================= */

render(playlists);
